# Temporary, branch-restricted bootstrap. Remove after package-lock.json lands.
name: Bootstrap npm lockfile
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'aos/mvp001-lockfile'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate deterministic npm lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to the same branch
        run: |
          node -e "const lock=require('./package-lock.json');if(lock.lockfileVersion!==3||lock.name!=='act-of-state')process.exit(1)"
          git add -- package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(deps): lock exact npm dependency graph'
            git push origin 'HEAD:aos/mvp001-lockfile'
          fi
