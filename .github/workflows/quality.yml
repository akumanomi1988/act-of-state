name: Quality (opt-in)
on:
  # Isolated development QA; never triggers Vercel publication.
  push:
    branches: [feature/aos-053-mandate-observatory]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aos-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run progress:check
      - run: npm run test:oracle
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install pinned browser QA tools without changing project lockfile
        run: npm install --no-save --package-lock=false playwright@1.56.1 axe-core@4.10.3
      - name: Chromium responsive + WCAG + mock-HTTP transaction smoke
        env:
          VITE_SUPABASE_URL: https://aos-browser-tests.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: synthetic_browser_publishable_key
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/aos-browser-server.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          node tests/browser-smoke.mjs
          node tests/demo-browser.mjs
          node tests/status-browser.mjs
      - name: Save browser screenshots for visual acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aos-browser-screenshots
          path: test-results/browser/*.png
          if-no-files-found: ignore
          retention-days: 7
